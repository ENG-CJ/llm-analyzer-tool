name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Check canonical version against tag
        shell: pwsh
        run: |
          $ExpectedTag = 'v' + (python -c "from llm_analyzer import __version__; print(__version__)")
          if ($ExpectedTag -ne $env:GITHUB_REF_NAME) { throw 'Tag does not match canonical application version' }
      - name: Build and validate standalone executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: llm-analyzer-windows-x64
          path: |
            dist/llm-analyzer-windows-x64.exe
            dist/llm-analyzer-windows-x64.exe.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/llm-analyzer-windows-x64.exe dist/llm-analyzer-windows-x64.exe.sha256 --verify-tag --generate-notes --title "Local LLM Analyzer $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
